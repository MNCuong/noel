<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merry Christmas, Khánh Linh</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  background:
    radial-gradient(ellipse at 50% 110%, #3a2350 0%, transparent 55%),
    radial-gradient(circle at top, #14254a, #070a1c 70%);
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}
canvas.dragging { cursor: grabbing; }

/* ---------- Trăng khuyết ---------- */
.moon {
  position: fixed;
  top: 6vh;
  right: 9vw;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  box-shadow: -9px 11px 0 0 #f7d08a;
  filter: drop-shadow(0 0 6px rgba(255, 220, 140, .9)) drop-shadow(0 0 16px rgba(255, 200, 120, .45));
  pointer-events: none;
}

/* ---------- Tiêu đề + chữ chạy ---------- */
.top {
  position: fixed;
  top: 18px;
  left: 0;
  right: 0;
  text-align: center;
  pointer-events: none;
  z-index: 5;
  opacity: 0;
  transition: opacity 2s ease 1s;
}
.opened .top { opacity: 1; }

.top h1 {
  margin: 0;
  font-family: 'Segoe Script', cursive, sans-serif;
  font-weight: normal;
  font-size: clamp(30px, 5vw, 46px);
  color: #ffcccc;
  text-shadow: 0 0 10px #ff0000, 0 0 20px #ff6666;
}

#marquee-container {
  margin: 6px auto 0;
  width: 60%;
  white-space: nowrap;
  overflow: hidden;
  mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
  -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
}
#marquee-text {
  display: inline-block;
  font-family: 'Segoe Script', cursive, sans-serif;
  font-size: 22px;
  color: #ffcccc;
  text-shadow: 0 0 10px #ff0000, 0 0 20px #ff6666;
  padding-left: 100%;
  animation: marquee 55s linear infinite;
}
@keyframes marquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

/* ---------- Chữ ký ---------- */
.sign {
  position: fixed;
  right: 30px;
  bottom: 28px;
  text-align: right;
  font-family: 'Segoe Script', cursive, sans-serif;
  pointer-events: none;
  z-index: 5;
  opacity: 0;
  transition: opacity 2s ease 3s;
}
.opened .sign { opacity: 1; }
.sign .to {
  font-size: 22px;
  color: rgba(255, 230, 180, .95);
  text-shadow: 0 0 12px rgba(255, 215, 150, .8);
  animation: signGlow 3.5s ease-in-out infinite;
}
.sign .from {
  font-size: 16px;
  color: rgba(255, 255, 255, .8);
  margin-top: 4px;
}
@keyframes signGlow {
  50% { text-shadow: 0 0 18px rgba(255, 215, 150, .95); }
}

/* ---------- Nút nhạc ---------- */
.music {
  position: fixed;
  left: 26px;
  bottom: 26px;
  z-index: 6;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 204, 204, .7);
  background: transparent;
  color: #ffcccc;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  text-shadow: 0 0 8px #ff6666;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease 2s;
}
.opened .music { opacity: 1; pointer-events: auto; }
.music.playing { animation: spin 6s linear infinite; }
.music:not(.playing)::after {
  content: "";
  position: absolute;
  left: 8px; right: 8px; top: 50%;
  height: 1.5px;
  background: rgba(255, 204, 204, .8);
  transform: rotate(-40deg);
}
@keyframes spin { to { transform: rotate(360deg); } }

#hint {
  position: fixed;
  bottom: 20px;
  width: 100%;
  text-align: center;
  color: rgba(255, 255, 255, .6);
  font-family: sans-serif;
  font-size: 14px;
  pointer-events: none;
  z-index: 5;
  opacity: 0;
  transition: opacity 1.2s ease;
}
#hint.show { opacity: 1; }

/* ---------- Màn mở quà ---------- */
.intro {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px;
  text-align: center;
  cursor: pointer;
  background: rgba(5, 8, 24, .55);
  transition: opacity 1.4s ease, visibility 1.4s;
}
.opened .intro { opacity: 0; visibility: hidden; }
.intro .gift {
  width: 72px;
  height: 72px;
  animation: float 3s ease-in-out infinite;
}
.intro .to {
  font-family: 'Segoe Script', cursive, sans-serif;
  font-size: clamp(30px, 7vw, 44px);
  color: #ffcccc;
  text-shadow: 0 0 10px #ff0000, 0 0 20px #ff6666;
}
.intro .tap {
  font-family: 'Segoe Script', cursive, sans-serif;
  font-size: 16px;
  color: rgba(255, 230, 180, .9);
  animation: breathe 2.4s ease-in-out infinite;
}
@keyframes float { 50% { transform: translateY(-10px) rotate(-5deg); } }
@keyframes breathe { 50% { opacity: .45; } }

@media (max-width: 560px) {
  #marquee-container { width: 86%; }
  #marquee-text { font-size: 18px; }
  .moon { top: 21vh; right: 8vw; width: 40px; height: 40px; box-shadow: -7px 8px 0 0 #f7d08a; }
  .sign { right: 18px; bottom: 20px; }
  .sign .to { font-size: 18px; }
  .sign .from { font-size: 13px; }
  .music { left: 18px; bottom: 20px; }
  #hint { bottom: 92px; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  #marquee-text, .intro .gift, .music.playing { animation: none; }
}
</style>
</head>
<body>

<div class="moon" aria-hidden="true"></div>

<canvas id="c" aria-label="Cây thông Noel 3D"></canvas>

<header class="top">
  <h1>Merry Christmas</h1>
  <div id="marquee-container">
    <div id="marquee-text"></div>
  </div>
</header>

<div class="sign">
  <div class="to">For <span data-name></span> ❄️</div>
  <div class="from">— from <span data-from></span></div>
</div>

<button class="music" id="music" type="button" aria-label="Bật/tắt nhạc">♪</button>

<div id="hint">Kéo để xoay cây · chạm để thả tim ♡</div>

<div class="intro" id="intro" role="button" tabindex="0" aria-label="Mở quà">
  <svg class="gift" viewBox="0 0 84 84" aria-hidden="true">
    <rect x="14" y="36" width="56" height="40" rx="4" fill="#e8667a"/>
    <rect x="10" y="26" width="64" height="14" rx="4" fill="#f08a9a"/>
    <rect x="37" y="26" width="10" height="50" fill="#ffe6b4"/>
    <path d="M42 26c-6-12-22-14-20-4 1 5 12 5 20 4zM42 26c6-12 22-14 20-4-1 5-12 5-20 4z" fill="none" stroke="#ffe6b4" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="42" cy="25" r="4" fill="#fff3da"/>
  </svg>
  <div class="to">Gửi <span data-name></span></div>
  <div class="tap">chạm vào để mở quà nhé ✨</div>
</div>

<audio id="bgm" loop preload="auto">
  <source src="./Lofi Jingle Bells.mp3" type="audio/mpeg">
</audio>

<script>
// ===================== CẤU HÌNH =====================
const CONFIG = {
  name: "Khánh Linh",
  from: "MNC",
  ring: "Gift for Khánh Linh  ♡  Merry Christmas  ✦  ",
  wishes: [
    "🎄 Chúc {name} một mùa Giáng Sinh thật ấm áp, hạnh phúc và luôn rạng rỡ như những ánh sao!",
    "Mong những điều dịu dàng nhất sẽ tìm đến {name} ✨",
    "Merry Christmas & Happy New Year ❄️"
  ]
};

const $ = s => document.querySelector(s);
document.querySelectorAll("[data-name]").forEach(el => el.textContent = CONFIG.name);
document.querySelectorAll("[data-from]").forEach(el => el.textContent = CONFIG.from);
$("#marquee-text").textContent = CONFIG.wishes.map(s => s.replaceAll("{name}", CONFIG.name)).join("     ·     ");

// ===================== TIỆN ÍCH =====================
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; };
const TAU = Math.PI * 2;
const PASTELS = ["#ffc4d6", "#ffd9b8", "#d9c8ff", "#c3e2ff", "#fff1b8", "#ffcccc"];

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return `rgb(${r},${g},${b})`;
}

// ===================== SPRITES =====================
function sprite(size, paint) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  paint(c.getContext("2d"), size);
  return c;
}
// Đèn: lõi rõ, quầng sáng ngắn (không bị nhoè)
function bulb(rgb) {
  return sprite(48, (g, s) => {
    const r = s / 2, gr = g.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, "rgba(255,255,255,1)");
    gr.addColorStop(0.16, `rgba(${rgb},1)`);
    gr.addColorStop(0.3, `rgba(${rgb},0.35)`);
    gr.addColorStop(0.65, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
  });
}
function bauble(hex) {
  return sprite(64, (g, s) => {
    const r = s / 2 - 3, cx = s / 2, cy = s / 2 + 2;
    const gr = g.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.05, cx, cy, r);
    gr.addColorStop(0, "rgba(255,255,255,.95)");
    gr.addColorStop(0.2, shade(hex, 0.3));
    gr.addColorStop(0.65, hex);
    gr.addColorStop(1, shade(hex, -0.45));
    g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
    g.fillStyle = "#f3d9a4"; g.fillRect(cx - 4, cy - r - 2, 8, 5);
  });
}

const BULB_COLORS = ["255,214,150", "255,214,150", "255,195,120", "255,240,180", "255,170,190", "255,225,160"];
const BULB_SPR = BULB_COLORS.map(bulb);
const BAUBLE_SPR = ["#f2899c", "#f6d28f", "#cbbcf6", "#a9cdf2", "#ffffff", "#e85a6f"].map(bauble);
const RIB_GOLD = bulb("255,215,150");
const RIB_AMBER = bulb("255,190,110");
const STAR_GLOW = bulb("255,225,150");

// ===================== CANVAS =====================
const cv = $("#c"), ctx = cv.getContext("2d");
let W, H, DPR, k, CX, CY;

const TREE_H = 520, TREE_R = 205, GROUND = 55, CAM = 1000, TILT = 0.16;
const RING_R = TREE_R + 82, RING_Y = -TREE_H * 0.33;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // Cây luôn nằm dưới phần tiêu đề + chữ chạy, không để chữ đè lên ngôi sao
  // ABOVE đã tính cả phối cảnh (ngọn cây nghiêng về phía camera nên to hơn ~10%)
  const ABOVE = 650, BELOW = GROUND + 30;
  const top = $(".top").getBoundingClientRect().bottom + 14, bottom = H * 0.93;
  k = Math.min(H / 960, W / 640, (bottom - top) / (ABOVE + BELOW));
  CX = W / 2;
  CY = (top + ABOVE * k + bottom - BELOW * k) / 2;
  makeSky();
  makeSnow();
}

// ---------- Phép chiếu 3D ----------
let cR = 1, sR = 0;
const cT = Math.cos(TILT), sT = Math.sin(TILT);
const O = { x: 0, y: 0, f: 1, z: 0 };
function P(x, y, z) {
  const X = x * cR - z * sR;
  const Z = x * sR + z * cR;
  const Y = y * cT - Z * sT;
  const Zt = y * sT + Z * cT;
  const f = CAM / (Zt + CAM) * k;
  O.x = CX + X * f; O.y = CY + Y * f; O.f = f; O.z = Z;
  return O;
}

// ===================== CẢNH =====================
function envelope(t) {
  const tiers = 7, local = (t * tiers) % 1;
  return TREE_R * Math.pow(1 - t, 1.05) * (0.6 + 0.4 * (1 - local));
}

// Lá thông + quả châu chung một danh sách để sắp xếp theo chiều sâu
const treeItems = [];
let nNeedles = 0;
while (nNeedles < 4200) {
  const t = Math.random();
  if (Math.random() > (1 - t) * 0.9 + 0.12) continue;
  const env = envelope(t);
  const r = env * (0.68 + 0.32 * Math.sqrt(Math.random()));
  const a = Math.random() * TAU;
  const roll = Math.random();
  let color;
  if (roll < 0.04) color = "rgb(255,150,170)";
  else if (roll < 0.08) color = "rgb(255,236,244)";
  else color = `rgb(${40 + Math.random() * 30},${120 + Math.random() * 100},${80 + Math.random() * 30})`;
  treeItems.push({
    kind: 0,
    x: Math.cos(a) * r, z: Math.sin(a) * r,
    y: -t * TREE_H + (r / TREE_R) * 14,
    t, size: rand(1.2, 2.8), color, rz: 0
  });
  nNeedles++;
}
for (let i = 0; i < 34; i++) {
  const t = rand(0.07, 0.84), a = Math.random() * TAU, r = envelope(t) * 0.98;
  treeItems.push({ kind: 1, x: Math.cos(a) * r, z: Math.sin(a) * r, y: -t * TREE_H + (r / TREE_R) * 14 + 6, t, size: rand(7, 11), spr: BAUBLE_SPR[i % BAUBLE_SPR.length], rz: 0 });
}

const bulbs = [];
for (let i = 0; i < 130; i++) {
  const t = rand(0.03, 0.93), a = Math.random() * TAU, r = envelope(t) * rand(0.96, 1.03);
  bulbs.push({ x: Math.cos(a) * r, z: Math.sin(a) * r, y: -t * TREE_H + (r / TREE_R) * 14, t, spr: pick(BULB_SPR), ph: Math.random() * TAU, sp: rand(1.2, 3) });
}

const ribbons = [];
[[0, RIB_GOLD], [Math.PI, RIB_AMBER]].forEach(([off, spr]) => {
  const N = 380;
  for (let i = 0; i < N; i++) {
    const u = i / N, t = 0.04 + u * 0.86;
    const a = u * 5.5 * TAU + off;
    const r = TREE_R * Math.pow(1 - t, 1.05) * 1.03;
    ribbons.push({ x: Math.cos(a) * r, z: Math.sin(a) * r, y: -t * TREE_H + (r / TREE_R) * 14 + Math.sin(a * 3) * 3, t, u, spr });
  }
});

const GIFT_SET = [["#e8667a", "#fff0d6"], ["#7fb8a4", "#fff0d6"], ["#f6efe2", "#e8667a"], ["#8fa6e0", "#ffe6b4"], ["#b99be0", "#fff0f5"], ["#f2c27a", "#fff6e0"]];
const gifts = [];
for (let i = 0; i < 9; i++) {
  const a = i * TAU / 9 + rand(-0.25, 0.25), d = rand(85, 175);
  const [c, r] = GIFT_SET[i % GIFT_SET.length];
  gifts.push({ x: Math.cos(a) * d, z: Math.sin(a) * d, s: rand(24, 38), h: rand(0.65, 1), c, r, t: rand(0.05, 0.4), zr: 0 });
}

const groundDots = [];
for (let i = 0; i < 600; i++) {
  const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * 330;
  groundDots.push({ x: Math.cos(a) * r, z: Math.sin(a) * r, s: rand(0.8, 2), ph: Math.random() * TAU, tw: Math.random() < 0.1 });
}

const ringLights = [];
for (let i = 0; i < 48; i++) {
  const a = i * TAU / 48;
  ringLights.push({ x: Math.cos(a) * 250, z: Math.sin(a) * 250, ph: i * 0.6, spr: i % 2 ? RIB_GOLD : RIB_AMBER });
}

// ---------- Chữ chạy vòng quanh cây ----------
const RING_FONT = "20px 'Segoe Script', cursive";
let ring = [];
function buildRing() {
  ctx.save();
  ctx.font = RING_FONT;
  const chars = [...CONFIG.ring], widths = chars.map(ch => ctx.measureText(ch).width + 1);
  const total = widths.reduce((a, b) => a + b, 0);
  const reps = Math.max(1, Math.round(TAU * RING_R / total));
  const step = TAU / (total * reps);
  ring = [];
  let acc = 0;
  for (let r = 0; r < reps; r++) {
    chars.forEach((ch, i) => { ring.push({ ch, a: (acc + widths[i] / 2) * step }); acc += widths[i]; });
  }
  ctx.restore();
}

// ---------- Bầu trời, tuyết, tim & sao bay ----------
let skyStars = [], flakes = [], floaters = [];
function makeSky() {
  const n = Math.max(120, Math.round(W * H / 7000));
  skyStars = Array.from({ length: n }, () => ({
    x: Math.random() * W, y: Math.random() * H * 0.75,
    s: Math.random() < 0.92 ? rand(0.5, 1.3) : rand(3, 5),
    ph: Math.random() * TAU, sp: rand(0.6, 2), b: rand(0.4, 0.95)
  }));
}
function newFloater(init) {
  return {
    x: Math.random() * W, y: init ? Math.random() * H : H + 20,
    vy: rand(10, 24), sway: rand(10, 28), ph: Math.random() * TAU,
    rot: Math.random() * TAU, vr: rand(-0.6, 0.6), size: rand(4, 8),
    kind: Math.random() < 0.55 ? 0 : 1, color: pick(PASTELS), a: rand(0.4, 0.8)
  };
}
function makeSnow() {
  const n = Math.min(260, Math.round(W * H / 6000));
  flakes = Array.from({ length: n }, () => {
    const z = Math.random();
    return { x: Math.random() * W, y: Math.random() * H, z, ph: Math.random() * TAU, size: 0.6 + z * 2.2, v: 18 + z * 45 };
  });
  floaters = Array.from({ length: Math.min(26, Math.round(W / 50)) }, () => newFloater(true));
}

function heartPath(s) {
  ctx.beginPath();
  ctx.moveTo(0, s * 0.45);
  ctx.bezierCurveTo(-s * 1.2, -s * 0.3, -s * 0.5, -s * 1.1, 0, -s * 0.4);
  ctx.bezierCurveTo(s * 0.5, -s * 1.1, s * 1.2, -s * 0.3, 0, s * 0.45);
  ctx.closePath();
}
function starPath(x, y, R, r, sx = 1) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R;
    const px = x + Math.cos(a) * rr * sx, py = y + Math.sin(a) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

const shooting = [];
let nextShoot = 3;
const bursts = [];
function burst(x, y, n = 18, power = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = rand(50, 200) * power;
    bursts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 50 * power, life: 0, max: rand(1.2, 2), size: rand(4, 8), rot: Math.random() * TAU, vr: rand(-3, 3), kind: Math.random() < 0.6 ? 0 : 1, color: pick(PASTELS) });
  }
}

// ===================== TRẠNG THÁI =====================
let rotY = 0.4, spin = 0.25, ringRot = 0;
const AUTO_SPIN = 0.25;
let opened = false, openedAt = 0, reveal = 0, starBurstDone = false;
let time = 0, last = performance.now();
let dragging = false;

// ===================== VẼ =====================
function drawSky(dt) {
  for (const s of skyStars) {
    const a = s.b * (0.55 + 0.45 * Math.sin(time * s.sp + s.ph));
    if (s.s > 2) {
      ctx.strokeStyle = `rgba(255,245,230,${a})`; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(s.x - s.s, s.y); ctx.lineTo(s.x + s.s, s.y);
      ctx.moveTo(s.x, s.y - s.s); ctx.lineTo(s.x, s.y + s.s);
      ctx.stroke();
    } else {
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
  }

  nextShoot -= dt;
  if (nextShoot <= 0) {
    nextShoot = rand(5, 10);
    const fromRight = Math.random() < 0.5;
    shooting.push({ x: fromRight ? rand(W * 0.5, W) : rand(0, W * 0.5), y: rand(0, H * 0.3), vx: (fromRight ? -1 : 1) * rand(450, 650), vy: rand(150, 260), life: 0, max: rand(0.7, 1.1) });
  }
  ctx.lineCap = "round";
  for (let i = shooting.length - 1; i >= 0; i--) {
    const s = shooting[i];
    s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.life > s.max) { shooting.splice(i, 1); continue; }
    const a = Math.sin(Math.PI * s.life / s.max);
    const tx = s.x - s.vx * 0.16, ty = s.y - s.vy * 0.16;
    const lg = ctx.createLinearGradient(s.x, s.y, tx, ty);
    lg.addColorStop(0, `rgba(255,240,245,${a})`); lg.addColorStop(1, "rgba(255,200,220,0)");
    ctx.strokeStyle = lg; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tx, ty); ctx.stroke();
  }
}

function drawFloaters(dt) {
  for (let i = 0; i < floaters.length; i++) {
    const f = floaters[i];
    f.y -= f.vy * dt; f.rot += f.vr * dt;
    if (f.y < -20) { floaters[i] = newFloater(false); continue; }
    const x = f.x + Math.sin(time * 0.6 + f.ph) * f.sway;
    // mờ dần khi bay lên cao
    ctx.globalAlpha = f.a * clamp(f.y / (H * 0.35));
    ctx.fillStyle = f.color;
    ctx.save();
    ctx.translate(x, f.y); ctx.rotate(f.kind ? f.rot : Math.sin(time + f.ph) * 0.3);
    if (f.kind) { starPath(0, 0, f.size, f.size * 0.45); ctx.fill(); }
    else { heartPath(f.size); ctx.fill(); }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawSnow(dt, minZ, maxZ, wind) {
  ctx.fillStyle = "#fff";
  for (const f of flakes) {
    if (f.z < minZ || f.z >= maxZ) continue;
    f.y += f.v * dt;
    f.x += (Math.sin(time * 0.7 + f.ph) * 10 * (0.3 + f.z) + wind * 80 * f.z) * dt;
    if (f.y > H + 10) { f.y = -10; f.x = Math.random() * W; }
    if (f.x > W + 10) f.x = -10; else if (f.x < -10) f.x = W + 10;
    ctx.globalAlpha = 0.45 + f.z * 0.5;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.size, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawGround() {
  const Rg = 350;
  const fFront = CAM / (GROUND * sT - Rg * cT + CAM) * k, fBack = CAM / (GROUND * sT + Rg * cT + CAM) * k;
  const yFront = CY + (GROUND * cT + Rg * sT) * fFront, yBack = CY + (GROUND * cT - Rg * sT) * fBack;
  const rx = Rg * CAM / (GROUND * sT + CAM) * k, ry = (yFront - yBack) / 2, ey = (yFront + yBack) / 2;

  ctx.save();
  ctx.translate(CX, ey); ctx.scale(1, ry / rx);
  const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  gr.addColorStop(0, "rgba(255,238,205,.95)");
  gr.addColorStop(0.45, "rgba(255,222,165,.8)");
  gr.addColorStop(0.75, "rgba(245,190,120,.4)");
  gr.addColorStop(1, "rgba(230,160,100,0)");
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, rx, 0, TAU); ctx.fill();
  ctx.restore();

  for (const d of groundDots) {
    P(d.x, GROUND, d.z);
    if (d.tw) {
      const a = Math.max(0, Math.sin(time * 2 + d.ph));
      if (a < 0.05) continue;
      const s = 4 * O.f;
      ctx.strokeStyle = `rgba(255,235,190,${a})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(O.x - s, O.y); ctx.lineTo(O.x + s, O.y); ctx.moveTo(O.x, O.y - s); ctx.lineTo(O.x, O.y + s); ctx.stroke();
    } else {
      ctx.fillStyle = "rgba(255,245,220,.9)";
      ctx.fillRect(O.x, O.y, d.s * O.f, d.s * O.f);
    }
  }

  ctx.globalCompositeOperation = "lighter";
  for (const l of ringLights) {
    P(l.x, GROUND, l.z);
    ctx.globalAlpha = (0.4 + 0.6 * (0.5 + 0.5 * Math.sin(time * 2.5 - l.ph))) * clamp(reveal * 2);
    const s = 9 * O.f;
    ctx.drawImage(l.spr, O.x - s, O.y - s, s * 2, s * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

function drawTrunk() {
  const top = P(0, 0, 0).y, f = O.f, bot = P(0, GROUND, 0).y, w = 24 * f;
  ctx.fillStyle = "rgb(90,60,40)";
  ctx.beginPath();
  ctx.moveTo(CX - w * 0.4, top); ctx.lineTo(CX + w * 0.4, top);
  ctx.lineTo(CX + w * 0.55, bot); ctx.lineTo(CX - w * 0.55, bot); ctx.closePath(); ctx.fill();
}

function drawGift(g) {
  const pop = easeOutBack(clamp((reveal - g.t) / 0.25));
  if (pop <= 0) return;
  P(g.x, GROUND, g.z);
  const x = O.x, by = O.y, s = g.s * O.f * pop, h = s * g.h, top = by - h, d = s * 0.24;

  ctx.fillStyle = "rgba(60,50,110,.18)";
  ctx.beginPath(); ctx.ellipse(x, by, s * 0.65, s * 0.13, 0, 0, TAU); ctx.fill();

  ctx.fillStyle = g.c; ctx.fillRect(x - s / 2, top, s, h);
  ctx.fillStyle = shade(g.c, -0.12); ctx.fillRect(x + s * 0.2, top, s * 0.3, h);
  ctx.fillStyle = shade(g.c, 0.3);
  ctx.beginPath();
  ctx.moveTo(x - s / 2, top); ctx.lineTo(x + s / 2, top); ctx.lineTo(x + s * 0.42, top - d); ctx.lineTo(x - s * 0.42, top - d);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = g.r;
  ctx.fillRect(x - s * 0.07, top, s * 0.14, h);
  ctx.beginPath();
  ctx.moveTo(x - s * 0.07, top); ctx.lineTo(x + s * 0.07, top); ctx.lineTo(x + s * 0.06, top - d); ctx.lineTo(x - s * 0.06, top - d);
  ctx.closePath(); ctx.fill();

  ctx.strokeStyle = g.r; ctx.lineWidth = Math.max(1.2, s * 0.06);
  ctx.beginPath(); ctx.ellipse(x - s * 0.13, top - d * 0.5 - s * 0.06, s * 0.13, s * 0.07, -0.35, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x + s * 0.13, top - d * 0.5 - s * 0.06, s * 0.13, s * 0.07, 0.35, 0, TAU); ctx.stroke();
}

function drawTree() {
  for (const p of treeItems) p.rz = p.x * sR + p.z * cR;
  treeItems.sort((a, b) => b.rz - a.rz);

  for (const p of treeItems) {
    const vis = clamp((reveal - p.t) / 0.06);
    if (vis <= 0) continue;
    P(p.x, p.y, p.z);
    const depth = clamp(0.5 - O.z / (2 * TREE_R));
    ctx.globalAlpha = vis * (0.5 + 0.5 * depth);
    const s = p.size * O.f;
    if (p.kind === 0) {
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(O.x, O.y, s, 0, TAU); ctx.fill();
    } else {
      ctx.drawImage(p.spr, O.x - s, O.y - s, s * 2, s * 2);
    }
  }

  ctx.globalCompositeOperation = "lighter";
  for (const r of ribbons) {
    const vis = clamp((reveal - r.t) / 0.06);
    if (vis <= 0) continue;
    P(r.x, r.y, r.z);
    const depth = clamp(0.5 - O.z / (2 * TREE_R));
    const pulse = Math.pow(0.5 + 0.5 * Math.sin(r.u * 60 - time * 3), 6);
    ctx.globalAlpha = vis * (0.35 + 0.65 * pulse) * (0.2 + 0.8 * depth);
    const s = (3 + pulse * 3) * O.f;
    ctx.drawImage(r.spr, O.x - s, O.y - s, s * 2, s * 2);
  }
  for (const b of bulbs) {
    const vis = clamp((reveal - b.t) / 0.06);
    if (vis <= 0) continue;
    P(b.x, b.y, b.z);
    const depth = clamp(0.5 - O.z / (2 * TREE_R));
    const tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(time * b.sp + b.ph));
    ctx.globalAlpha = vis * tw * (0.2 + 0.8 * depth);
    const s = 8 * O.f;
    ctx.drawImage(b.spr, O.x - s, O.y - s, s * 2, s * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

function drawStar() {
  const pop = easeOutBack(clamp((reveal - 0.95) / 0.3));
  if (pop <= 0) return;
  P(0, -TREE_H - 30, 0);
  const x = O.x, y = O.y, f = O.f * pop;

  if (!starBurstDone && pop > 0.6) { starBurstDone = true; burst(x, y, 36, 1.3); }

  ctx.globalCompositeOperation = "lighter";
  const hs = 48 * f * (1 + Math.sin(time * 2) * 0.08);
  ctx.drawImage(STAR_GLOW, x - hs, y - hs, hs * 2, hs * 2);
  ctx.globalCompositeOperation = "source-over";

  const sx = 0.3 + 0.7 * Math.abs(Math.cos(time * 0.8));
  starPath(x, y, 24 * f, 10 * f, sx);
  ctx.fillStyle = "gold"; ctx.fill();
  ctx.strokeStyle = "rgba(255,250,220,.9)"; ctx.lineWidth = 1.2; ctx.stroke();

  // mấy ngôi sao nhỏ bay quanh đỉnh
  for (let i = 0; i < 3; i++) {
    const a = time * 1.2 + i * TAU / 3;
    const px = x + Math.cos(a) * 38 * f, py = y + Math.sin(a) * 12 * f;
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(a);
    ctx.fillStyle = PASTELS[i];
    starPath(px, py, 5 * f, 2.2 * f); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawRing(front) {
  const vis = clamp((reveal - 0.6) / 0.4);
  if (vis <= 0 || !ring.length) return;
  ctx.font = RING_FONT;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(255,102,102,.8)";
  ctx.shadowBlur = front ? 8 : 0;
  for (const c of ring) {
    const a = c.a + ringRot;
    P(Math.cos(a) * RING_R, RING_Y, Math.sin(a) * RING_R);
    const isFront = O.z <= 0;
    if (isFront !== front) continue;
    const nz = O.z / RING_R;
    const sx = (isFront ? 1 : -1) * Math.max(0.1, Math.abs(nz));
    ctx.fillStyle = `rgba(255,200,200,${(isFront ? 0.95 : 0.2) * vis})`;
    ctx.setTransform(DPR * sx * O.f, 0, 0, DPR * O.f, DPR * O.x, DPR * O.y);
    ctx.fillText(c.ch, 0, 0);
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.shadowBlur = 0;
}

function drawBursts(dt) {
  for (let i = bursts.length - 1; i >= 0; i--) {
    const p = bursts[i];
    p.life += dt;
    if (p.life > p.max) { bursts.splice(i, 1); continue; }
    p.vx *= 1 - dt * 1.8; p.vy = p.vy * (1 - dt * 1.8) + 40 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    ctx.globalAlpha = 1 - p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.kind === 0) heartPath(p.size); else starPath(0, 0, p.size, p.size * 0.45);
    ctx.fill(); ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ===================== VÒNG LẶP =====================
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; time += dt;

  if (!dragging) {
    spin += (AUTO_SPIN - spin) * Math.min(1, dt * 1.2);
    rotY += spin * dt;
  }
  ringRot -= dt * 0.2;
  cR = Math.cos(rotY); sR = Math.sin(rotY);
  if (opened) reveal = Math.min(1.3, (now - openedAt) / 3400 * 1.3);
  const wind = clamp((spin - AUTO_SPIN) * 0.6, -2, 2);

  ctx.clearRect(0, 0, W, H);
  drawSky(dt);
  drawFloaters(dt);
  drawSnow(dt, 0, 0.5, wind);
  drawGround();

  for (const g of gifts) { P(g.x, GROUND, g.z); g.zr = O.z; }
  gifts.sort((a, b) => b.zr - a.zr);

  for (const g of gifts) if (g.zr > 0) drawGift(g);
  drawRing(false);
  drawTrunk();
  drawTree();
  for (const g of gifts) if (g.zr <= 0) drawGift(g);
  drawStar();
  drawRing(true);
  drawSnow(dt, 0.5, 1.01, wind);
  drawBursts(dt);

  requestAnimationFrame(frame);
}

// ===================== TƯƠNG TÁC =====================
let lastX = 0, downX = 0, downY = 0, lastMoveT = 0;
cv.addEventListener("pointerdown", e => {
  dragging = true; lastX = downX = e.clientX; downY = e.clientY; lastMoveT = performance.now();
  cv.setPointerCapture(e.pointerId); cv.classList.add("dragging");
});
cv.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, nowT = performance.now();
  lastX = e.clientX;
  const d = dx * 0.006;
  rotY += d;
  spin = clamp(d / Math.max(0.008, (nowT - lastMoveT) / 1000), -6, 6);
  lastMoveT = nowT;
});
function endDrag(e) {
  if (!dragging) return;
  dragging = false; cv.classList.remove("dragging");
  if (performance.now() - lastMoveT > 120) spin = AUTO_SPIN + (spin - AUTO_SPIN) * 0.2;
  if (Math.hypot(e.clientX - downX, e.clientY - downY) < 6 && opened) burst(e.clientX, e.clientY);
}
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);

// ===================== NHẠC =====================
const bgm = $("#bgm"), musicBtn = $("#music");
let fadeTimer = null;
function fadeTo(target, ms, done) {
  clearInterval(fadeTimer);
  const start = bgm.volume, t0 = performance.now();
  fadeTimer = setInterval(() => {
    const p = clamp((performance.now() - t0) / ms);
    bgm.volume = clamp(start + (target - start) * p);
    if (p >= 1) { clearInterval(fadeTimer); done && done(); }
  }, 40);
}
function setMusicUI(on) { musicBtn.classList.toggle("playing", on); }
function playMusic() {
  bgm.volume = 0;
  bgm.play().then(() => { setMusicUI(true); fadeTo(0.6, 2500); })
    .catch(err => { console.log("Audio play blocked:", err); setMusicUI(false); });
}
musicBtn.addEventListener("click", () => {
  if (bgm.paused) playMusic();
  else { setMusicUI(false); fadeTo(0, 600, () => bgm.pause()); }
});

// ===================== MỞ QUÀ =====================
const hint = $("#hint"), intro = $("#intro");
function openGift() {
  if (opened) return;
  opened = true; openedAt = performance.now();
  document.body.classList.add("opened");
  playMusic();
  setTimeout(() => hint.classList.add("show"), 4200);
  setTimeout(() => hint.classList.remove("show"), 12000);
}
intro.addEventListener("click", openGift);
intro.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openGift(); } });

// ===================== BẮT ĐẦU =====================
window.addEventListener("resize", resize);
resize();
buildRing();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { resize(); buildRing(); });
requestAnimationFrame(t => { last = t; frame(t); });
</script>
</body>
